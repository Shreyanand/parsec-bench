schema_version = "1.3"

[task]
name = "bench/bench-v4-platform-071-unmonitored-proxy-not-esxi-alert"
description = "Authored bench scenario (see provenance.md)"

[metadata]
suite = "bench/v4"
services = ["platform", "icinga"]

[environment]
docker_image = "registry.access.redhat.com/ubi9/ubi:latest"
workdir = "/"

[[environment.mcp_servers]]
name = "platform"
url = "${PLATFORM_MCP_URL}"

[[environment.mcp_servers]]
name = "icinga"
url = "${ICINGA_MCP_URL}"

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 900.0
