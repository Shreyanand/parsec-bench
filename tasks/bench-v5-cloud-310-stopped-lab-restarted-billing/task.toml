schema_version = "1.3"

[task]
name = "bench/bench-v5-cloud-310-stopped-lab-restarted-billing"
description = "Authored bench scenario (see provenance.md)"

[metadata]
suite = "bench/v5"
kind = "trap"
services = ["cloud", "platform", "cost"]

[environment]
docker_image = "registry.access.redhat.com/ubi9/ubi:latest"
workdir = "/"

[[environment.mcp_servers]]
name = "cloud"
url = "${CLOUD_MCP_URL}"

[[environment.mcp_servers]]
name = "platform"
url = "${PLATFORM_MCP_URL}"

[[environment.mcp_servers]]
name = "cost"
url = "${COST_MCP_URL}"

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 900.0
